<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F5A623">
  <title>غير متصل – D&A</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#fffdf7;color:#3d2914;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;text-align:center}
    .card{max-width:360px;background:#fff;border:2px solid #f5a623;border-radius:16px;padding:2rem;box-shadow:0 8px 32px rgba(61,41,20,.12)}
    .bee{font-size:3rem;margin-bottom:.5rem}
    h1{font-size:1.25rem;margin-bottom:.75rem;color:#8b5a2b}
    p{line-height:1.7;color:#666;margin-bottom:1.25rem}
    button{padding:.75rem 1.5rem;background:linear-gradient(135deg,#f5a623,#ffaa00);border:0;border-radius:999px;font-weight:700;font-size:1rem;cursor:pointer;color:#3d2914}
  </style>
</head>
<body>
  <div class="card">
    <div class="bee">🐝</div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>تعذر تحميل لوحة التحكم. تحقق من اتصال Wi‑Fi أو بيانات الجوال ثم أعد المحاولة.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>

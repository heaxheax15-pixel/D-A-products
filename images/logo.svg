<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- تدرج ذهبي فاخر -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="40%" stop-color="#F0A500"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <!-- ظل -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- دائرة خلفية شفافة (اختيارية، لإبراز الشعار) -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.15"/>

  <!-- قطرة العسل الرئيسية -->
  <path d="M256 40 C340 130 390 210 390 320 C390 420 330 472 256 472 C182 472 122 420 122 320 C122 210 172 130 256 40 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="12" filter="url(#shadow)"/>

  <!-- خلية النحل -->
  <polygon points="256,90 284,106 284,138 256,154 228,138 228,106"
           fill="none" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)"/>
  <polygon points="256,106 270,114 270,128 256,136 242,128 242,114"
           fill="url(#goldGrad)"/>

  <!-- عنق البرطمان -->
  <line x1="190" y1="175" x2="322" y2="175" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
  <line x1="200" y1="195" x2="312" y2="195" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- حرف D الكبير -->
  <path d="M175 200 L175 380 Q355 380 355 290 Q355 200 175 200 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- حرف A داخل D -->
  <path d="M240 360 L285 225 L330 360 M255 305 L315 305"
        fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- تدفق العسل في الأسفل -->
  <path d="M185 395 Q256 430 327 395 Q295 450 256 455 Q217 450 185 395"
        fill="url(#goldGrad)" filter="url(#shadow)"/>

  <!-- قطرة العسل الصغيرة -->
  <path d="M256 455 C274 480 274 500 256 512 C238 500 238 480 256 455 Z"
        fill="url(#goldGrad)" filter="url(#shadow)"/>
</svg>
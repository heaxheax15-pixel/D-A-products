<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="D&amp;A Product">
  <defs>
    <linearGradient id="honeyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDB530"/>
      <stop offset="0.55" stop-color="#DF9417"/>
      <stop offset="1" stop-color="#BD6412"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F8D67F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F8D67F" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="dropClip">
      <path d="M60 20 C60 20 84 50 84 70 a24 24 0 0 1 -48 0 C36 50 60 20 60 20 Z"/>
    </clipPath>
  </defs>

  <!-- soft golden glow, gentle pulsing -->
  <circle cx="60" cy="64" r="52" fill="url(#glowGrad)">
    <animate attributeName="r" values="48;54;48" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- the honey drop, floating -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3.5; 0 0" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>

    <path d="M60 20 C60 20 84 50 84 70 a24 24 0 0 1 -48 0 C36 50 60 20 60 20 Z"
          fill="url(#honeyGrad)" stroke="#3E1504" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- shimmer sweep across the drop -->
    <g clip-path="url(#dropClip)">
      <rect x="-40" y="0" width="34" height="120" fill="url(#shineGrad)" transform="skewX(-18)">
        <animate attributeName="x" values="-40;130" dur="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- inner highlight -->
    <ellipse cx="51" cy="62" rx="6" ry="11" fill="#FFFCF4" opacity="0.55" transform="rotate(-20 51 62)">
      <animate attributeName="opacity" values="0.45;0.7;0.45" dur="3.6s" repeatCount="indefinite"/>
    </ellipse>

    <!-- D&A wordmark inside the drop -->
    <text x="60" y="76" text-anchor="middle"
          font-family="Georgia, 'Amiri', serif" font-size="20" font-weight="700"
          fill="#3E1504" letter-spacing="0.5">D&amp;A</text>

    <!-- small honey droplet falling off the tip -->
    <circle cx="60" cy="96" r="3.2" fill="#DF9417">
      <animate attributeName="cy" values="96;108;96" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 0.45; 0.55 0 1 0.45"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- orbiting bee -->
  <g>
    <animateMotion dur="5.2s" repeatCount="indefinite" path="M60 64 m0 -46 a46 46 0 1 1 -0.1 0 z" rotate="auto"/>
    <g transform="translate(-9,-6)">
      <ellipse cx="9" cy="7" rx="4.2" ry="6" fill="#EDB530" stroke="#3E1504" stroke-width="1.8"/>
      <path d="M4.9 5.2 h8.2 M4.9 8.8 h8.2" stroke="#3E1504" stroke-width="1.6"/>
      <ellipse cx="4.5" cy="3" rx="3.2" ry="2.2" fill="#FFFCF4" opacity="0.85" transform="rotate(-30 4.5 3)">
        <animate attributeName="ry" values="2.2;0.8;2.2" dur="0.22s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="13.5" cy="3" rx="3.2" ry="2.2" fill="#FFFCF4" opacity="0.85" transform="rotate(30 13.5 3)">
        <animate attributeName="ry" values="2.2;0.8;2.2" dur="0.22s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>
</svg>
